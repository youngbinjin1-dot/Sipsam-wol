<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>덜내요 카드뉴스 v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 덜내요 카드뉴스 v2 — 다크 · 그라데이션 · 입체감. 카드는 1080×1350 원본 좌표로 그리고 화면 폭에 맞춰 축소한다. */
:root{
  --bg:#0A0A0D; --page-fg:#EEF1F6; --page-muted:#9EA4A9;
  --t1:#FFFFFF; --t2:#C3C3C6; --t3:#9E9EA4; --blue:#3485FA; --blue-l:#8CC4FF;
  --font:'Pretendard Variable','Pretendard','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo',system-ui,sans-serif;
  --grad-blue:linear-gradient(135deg,#6FB6FF 0%,#3485FA 55%,#1B4FD8 100%);
  --grad-title:linear-gradient(180deg,#FFFFFF 0%,#CFE4FF 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--page-fg);font-family:var(--font);padding:32px max(16px,env(safe-area-inset-left,0px)) 56px}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:clamp(22px,3.4vw,30px);margin:0 0 8px;letter-spacing:-.02em}
.lede{margin:0 0 28px;color:var(--page-muted);font-size:15px;line-height:1.6;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px 22px}
figure{margin:0;min-width:0}
.stage{width:100%;aspect-ratio:1080/1350;position:relative;overflow:hidden;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
figcaption{margin-top:10px;font-size:13px;color:var(--page-muted)}
figcaption b{color:var(--page-fg)}

/* ---------- 카드 공통 ---------- */
.card{width:1080px;height:1350px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;font-family:var(--font);color:var(--t1);word-break:keep-all;letter-spacing:-.02em;background:linear-gradient(180deg,#10162A 0%,#17171C 50%,#0B0C12 100%)}
.card .abs{position:absolute}
.rot{transform-origin:0 0}
.glow{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none}
.hd{position:absolute;left:88px;top:88px;width:904px;display:flex;justify-content:space-between;align-items:center;font-size:24px;line-height:1.3}
.hd b{font-weight:700;letter-spacing:.04em}
.hd span{font-weight:500;color:var(--t3)}
.ft{position:absolute;left:88px;top:1262px;font-size:22px;line-height:1.4;color:var(--t3)}
.gt{background:var(--grad-title);-webkit-background-clip:text;background-clip:text;color:transparent}
.gb{background:linear-gradient(180deg,#6FB6FF,#3485FA 55%,#1B4FD8);-webkit-background-clip:text;background-clip:text;color:transparent}
.pre{white-space:pre-line}

/* 기능 카드 상단 텍스트 */
.ftext{position:absolute;left:88px;top:118px;width:904px}
.tag{display:inline-block;margin-top:72px;padding:12px 24px;border-radius:999px;background:rgba(52,133,250,.16);border:1px solid rgba(52,133,250,.6);color:var(--blue-l);font-size:26px;font-weight:700;line-height:1.2}
.ttl{margin:32px 0 0;font-size:72px;font-weight:900;line-height:1.28;letter-spacing:-.03em}
.dsc{margin:24px 0 0;font-size:32px;line-height:1.5;color:var(--t2)}

/* 유리 카드 · 알약 · 구 */
.glass{border-radius:36px;background:linear-gradient(135deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1.5px solid rgba(255,255,255,.2);box-shadow:0 40px 80px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.18);-webkit-backdrop-filter:blur(40px);backdrop-filter:blur(40px);display:flex;flex-direction:column}
.pill{display:inline-flex;align-items:center;padding:16px 28px;border-radius:999px;font-weight:700;line-height:1.2;white-space:nowrap;background:var(--grad-blue);border:1px solid rgba(255,255,255,.3);box-shadow:0 16px 40px rgba(27,79,216,.55),inset 0 2px 0 rgba(255,255,255,.18)}
.pill.ghost{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:var(--t2);box-shadow:inset 0 2px 0 rgba(255,255,255,.18)}
.sphere{position:absolute;border-radius:50%;background:linear-gradient(135deg,#A9D4FF 0%,#3485FA 45%,#0A2A7A 100%);box-shadow:0 45px 90px rgba(0,0,0,.6),inset -18px -24px 45px rgba(0,0,26,.45)}
.sphere::after{content:"";position:absolute;left:20%;top:12%;width:32%;height:20%;border-radius:50%;transform:rotate(-20deg);background:radial-gradient(closest-side,rgba(255,255,255,.85),rgba(255,255,255,0))}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.icon{width:64px;height:64px;border-radius:20px;background:var(--grad-blue);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),0 10px 24px rgba(0,0,0,.4);flex:none}
.chk{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06)}
.chk.on{background:var(--grad-blue);border-color:rgba(255,255,255,.3)}
.tile{flex:1;border-radius:24px;padding:26px 28px;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12)}
.tile.on{background:linear-gradient(135deg,rgba(52,133,250,.35),rgba(27,79,216,.15));border-color:rgba(111,182,255,.6)}
.step{width:285px;padding:32px;gap:12px;border-radius:32px}
.step.on{background:linear-gradient(135deg,rgba(52,133,250,.35),rgba(27,79,216,.12));border:2px solid rgba(111,182,255,.8);box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 60px rgba(52,133,250,.6),inset 0 2px 0 rgba(255,255,255,.18)}

/* 내보내기 모드(?raw): 카드를 원본 크기로 나열 */
body.raw{padding:0;background:#000}
body.raw .wrap{max-width:none}
body.raw h1,body.raw .lede,body.raw figcaption{display:none}
body.raw .grid{display:block}
body.raw .stage{width:1080px;height:1350px;border-radius:0;box-shadow:none;margin:0 0 20px}
</style>
</head>
