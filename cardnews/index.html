<title>연말정산 카드뉴스</title>

<style>
/* Layout: 카드뉴스 7장을 반응형 그리드로 나열. 각 카드는 1080×1350 원본을 비율 축소 */
:root{
  --bg:#EEF1F5; --fg:#191f28; --muted:#5B6270; --panel:#FFFFFF; --line:#D9DEE6;
  --blue:#3182F6; --blue-soft:#e8f3ff; --blue-mute:#B9D3F8; --paper:#ffffff; --dark:#191f28; --dark-mute:#b0b8c1; --gray:#F2F4F6; --red:#e42939; --red-soft:#ffeeee; --yellow:#FFD84D; --amber:#fe9800; --green:#03b26c;
  --font:'Toss Product Sans','Pretendard Variable','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--fg:#EEF1F6;--muted:#9AA3B2;--panel:#181C24;--line:#2A303B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101319;--fg:#EEF1F6;--muted:#9AA3B2;--panel:#181C24;--line:#2A303B;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;padding-block:32px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:clamp(22px,3.4vw,32px);margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance}
.lede{margin:0 0 28px;color:var(--muted);font-size:15px;line-height:1.6;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:28px 22px}
figure{margin:0;min-width:0}
.stage{width:100%;position:relative;overflow:hidden;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 28px rgba(0,0,0,.10);background:var(--paper)}
figcaption{margin-top:10px;font-size:13px;color:var(--muted)}
figcaption b{color:var(--fg);font-weight:700}

/* ---------- 카드 (1080×1350 기준 px) ---------- */
.card{width:1080px;height:1350px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;display:flex;flex-direction:column;font-family:var(--font);letter-spacing:-.01em;word-break:keep-all}
.card.light{background:var(--paper);color:#191f28;padding:96px 96px 0}
.hd{display:flex;justify-content:space-between;align-items:center}
.num{font-size:30px;font-weight:700;color:var(--blue);letter-spacing:.16em}
.tag{background:var(--blue-soft);color:#1b64da;font-size:28px;font-weight:700;padding:12px 26px;border-radius:100px}
.ttl{font-size:68px;font-weight:900;line-height:1.25;letter-spacing:-.03em;margin:52px 0 0;white-space:pre-line}
.cap{font-size:36px;line-height:1.45;color:#4e5968;margin:28px 0 0;white-space:pre-line}
.note{font-size:24px;color:#8b95a1;margin:12px 0 0}
.grow{flex:1}
.ins{background:var(--blue-soft);border-radius:28px;padding:40px 44px;margin-bottom:56px}
.ins small{display:block;font-size:24px;font-weight:700;color:#1b64da;letter-spacing:.3em;margin-bottom:12px}
.ins p{margin:0;font-size:38px;font-weight:700;line-height:1.35;white-space:pre-line}

/* 표지: 멈춰 세우는 큰 타이포 + 스티커 + 테이프 */
.cover{background:#ffffff;color:#191f28;padding:96px 96px 250px;position:relative}
.cover .giant{position:absolute;right:-30px;top:110px;font-size:430px;font-weight:900;line-height:1;letter-spacing:-.06em;color:#3182f6;transform:rotate(-6deg);white-space:nowrap}
.kick{font-size:34px;font-weight:700;color:#fff;position:relative;display:inline-block;align-self:flex-start;background:#3182f6;padding:12px 26px;border-radius:100px}
.sticker{position:absolute;right:56px;top:500px;z-index:2;background:#e42939;color:#fff;font-size:40px;font-weight:700;padding:26px 40px 30px;border-radius:30px;transform:rotate(8deg);line-height:1.15;text-align:center}
.sticker b{display:block;font-size:84px;font-weight:900;letter-spacing:-.04em}
.cover h2{font-size:108px;font-weight:900;line-height:1.2;letter-spacing:-.05em;margin:0;white-space:pre-line;position:relative}
.hero3d{flex:1;display:flex;align-items:center;justify-content:center;perspective:1600px;margin-top:10px;position:relative}
.hero3d svg{transform:rotateY(-16deg) rotateX(7deg);transform-origin:center;max-width:100%;height:auto;filter:drop-shadow(0 30px 30px rgba(25,31,40,.16))}
.cover mark{background:#ffd158;color:#191f28;padding:0 16px;border-radius:14px;margin-left:-6px}
.cover p{font-size:38px;line-height:1.5;color:#4e5968;margin:0;white-space:pre-line;position:relative}
.tape{position:absolute;left:-60px;width:1200px;bottom:78px;transform:rotate(-3deg);background:#3182f6;color:#fff;font-size:40px;font-weight:900;padding:24px 0;white-space:nowrap;overflow:hidden;letter-spacing:-.01em}
.close{background:var(--dark);color:#fff;padding:96px 96px 80px}
.close h2{font-size:100px;font-weight:900;line-height:1.25;letter-spacing:-.04em;margin:0 0 44px;white-space:pre-line}
.close p{font-size:38px;line-height:1.5;color:var(--dark-mute);margin:0 0 56px;white-space:pre-line}
.cta{align-self:flex-start;background:#ffd158;color:#191f28;font-size:38px;font-weight:700;padding:30px 48px;border-radius:100px}
.disc{font-size:24px;color:var(--dark-mute);margin-top:56px}

.close2 h2{font-size:120px;line-height:1.2;margin:0 0 36px}
.close2 p{margin:0 0 34px}
.close2 .cta{background:#3182f6;color:#fff;margin:0;align-self:flex-start}
.close2 .disc{color:#8b95a1;margin:26px 0 0;font-size:24px}
.close2{padding:210px 96px 96px}
.close2 .tape{top:110px;bottom:auto;background:#e42939;color:#fff}
/* 여정: 달마다 색이 다른 타임라인 */
.tl{margin-top:48px;display:flex;flex-direction:column}
.mo{display:flex;gap:36px}
.mo .c{width:130px;flex:none;display:flex;flex-direction:column;align-items:center}
.mo .dot{width:130px;height:130px;border-radius:50%;display:grid;place-items:center;font-size:46px;font-weight:900;color:#fff;letter-spacing:-.04em}
.mo .line{width:8px;flex:1;min-height:20px;background:#d1d6db;border-radius:4px;margin:8px 0}
.mo .b{flex:1;padding:8px 0 40px}

.mo p{font-size:32px;line-height:1.45;color:#4e5968;margin:0;white-space:pre-line}
.mo.last .b{padding-bottom:0}

.phone{width:540px;height:1100px;flex:none;background:#191f28;border-radius:68px;padding:12px;}

.tb{display:flex;align-items:center;gap:16px;font-size:26px;font-weight:700}
.tb i{font-style:normal;font-size:30px;font-weight:400}
.redc{background:var(--red);color:#fff;border-radius:28px;padding:30px 28px}
.redc small{display:block;font-size:17px;opacity:.85;margin-bottom:10px}
.redc b{font-size:50px;letter-spacing:-.03em;line-height:1.15}
.two{display:flex;gap:14px}
.tile{flex:1;background:var(--gray);border-radius:24px;padding:20px;text-align:center}
.tile small{display:block;font-size:16px;color:#6b7684;margin-bottom:8px}
.tile b{font-size:23px}
.box{background:var(--gray);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center}
.row span{font-size:17px;color:#6b7684}.row b{font-size:21px}
.bar{height:14px;border-radius:7px;background:#e5e8eb;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.mini{font-size:16px;color:#6b7684}
.pillw{display:flex;justify-content:center}
.pill{background:var(--gray);color:#6b7684;font-size:17px;font-weight:700;padding:12px 24px;border-radius:100px}
.h3{font-size:32px;font-weight:900;margin:2px 0 0;letter-spacing:-.02em}
.way{display:flex;align-items:center;gap:18px;border:2px solid #e5e8eb;border-radius:26px;padding:22px}
.way .ic{width:64px;height:64px;border-radius:18px;background:var(--blue-soft);display:grid;place-items:center;font-size:30px;flex:none}
.way .t{flex:1;font-size:21px;font-weight:700;line-height:1.25;white-space:pre-line}
.way .t em{display:block;font-style:normal;margin-top:8px;width:max-content;background:var(--red-soft);color:var(--red);font-size:15px;padding:6px 14px;border-radius:100px}

.sl .ln{position:absolute;left:0;right:0;top:11px;height:8px;border-radius:4px;background:#e5e8eb}

.sl .kn{position:absolute;top:0;width:30px;height:30px;border-radius:50%;background:var(--blue);margin-left:-15px}
.big{font-size:42px;font-weight:900;letter-spacing:-.03em}
.ttl2{font-size:22px;font-weight:700}
.tile.w{background:#fff;padding:20px 14px}.tile.w b{font-size:26px}
.btn{background:var(--blue);color:#fff;text-align:center;font-size:22px;font-weight:600;padding:20px;border-radius:16px;margin-top:4px}
.btn.ghost{background:#fff;color:#191f28;border:2px solid #e5e8eb;padding:14px;font-size:19px;margin-top:0}
.btn.hero{font-size:26px;padding:26px;border-radius:16px;box-shadow:0 0 0 8px #c9e2ff;margin:6px 8px 10px}
.chip{align-self:flex-start;background:var(--blue-soft);color:#1b64da;font-size:18px;font-weight:700;padding:10px 18px;border-radius:100px}
.cmp{display:flex;align-items:center;gap:16px;background:var(--gray);border-radius:24px;padding:24px;text-align:center}
.cmp>div{flex:1}.cmp small{display:block;font-size:16px;color:#6b7684;margin-bottom:6px}.cmp b{font-size:28px}.cmp>span{font-size:26px;color:#6b7684}

.tbl{border:2px solid #e5e8eb;border-radius:24px;overflow:hidden}
.tr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px}
.tr+.tr{border-top:2px solid #e5e8eb}
.tr.rec{background:var(--blue-soft)}
.tr .k b{display:block;font-size:21px}.tr .k small{display:block;font-size:15px;color:#6b7684;margin-top:4px}
.tr .v{text-align:right;font-size:20px;font-weight:700}.tr .v small{display:block;font-size:16px;color:var(--blue);margin-top:4px}
.fine{font-size:15px;color:#8b95a1;text-align:center}

<script>
(function(){
  var grid=document.getElementById('grid');
  grid.appendChild(document.getElementById('t-cards').content.cloneNode(true));
  var stages=[].slice.call(grid.querySelectorAll('.stage'));
  function fit(){
    stages.forEach(function(s){
      var k=s.clientWidth/1080, c=s.firstElementChild;
      c.style.transform='scale('+k+')'; s.style.height=(1350*k)+'px';
    });
  }
  fit();
  if(window.ResizeObserver){ new ResizeObserver(fit).observe(grid); } else { window.addEventListener('resize',fit); }
})();
</script>
