<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>덜내요 (가제) | 앱 모의실행</title>
<style>
:root{
  --blue:#3182f6; --blue-d:#1b64da; --blue-w:#e8f3ff; --t1:#191f28; --t2:#4e5968; --t3:#6b7684; --t4:#8b95a1;
  --line:#e5e8eb; --g1:#f2f4f6; --g0:#f9fafb; --red:#f04452; --red-w:#ffeeee; --ok:#0f7b4a; --ok-w:#e6f6ee; --warn:#b45f06; --warn-w:#fff3e0;
}
*{box-sizing:border-box}
body{margin:0;background:#e9edf2;color:var(--t1);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer}
.stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:24px 12px}
.phone{width:390px;height:780px;max-height:calc(100vh - 48px);background:#fff;border-radius:32px;box-shadow:0 12px 40px rgba(0,0,0,.18);position:relative;overflow:hidden;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;padding:20px 20px 24px}
.nav{display:flex;border-top:1px solid var(--line);background:#fff}
.nav[hidden]{display:none}
.nav button{flex:1;min-height:56px;border:0;background:none;color:var(--t4);font-size:12px;font-weight:600}
.nav button[aria-current=true]{color:var(--blue)}
.nav .ic{display:block;font-size:20px;line-height:1.2}
.topbar{display:flex;align-items:center;gap:8px;margin:-4px 0 12px}
.back{border:0;background:none;font-size:22px;padding:4px 8px 4px 0;color:var(--t2)}
.step{font-size:12px;color:var(--t4);margin-left:auto}
h1{font-size:25px;line-height:1.35;letter-spacing:-.02em;margin:8px 0 10px}
h1 em{font-style:normal;color:var(--blue)}
h2{font-size:21px;line-height:1.4;margin:6px 0 8px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 4px}
p{margin:0 0 10px}
.sub{color:var(--t2);font-size:15px}
.fine{font-size:12px;color:var(--t3)}
.tag{display:inline-block;background:var(--blue-w);color:var(--blue);font-weight:600;font-size:12px;padding:3px 10px;border-radius:99px}
.tag.red{background:var(--red-w);color:#c9222f}.tag.gray{background:var(--g1);color:var(--t2)}.tag.ok{background:var(--ok-w);color:var(--ok)}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--blue);color:#fff;font-size:16px;font-weight:700;margin-top:12px}
.btn:disabled{background:#d1d6db;cursor:not-allowed}
.btn.sec{background:var(--g1);color:var(--t1)}
.btn.sm{min-height:40px;font-size:14px;border-radius:10px;margin-top:8px}
.btn.danger{background:var(--red)}
.card{background:var(--g0);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card.blue{background:var(--blue-w);border-color:transparent}
.card.red{background:var(--red-w);border-color:transparent}
.card.ok{background:var(--ok-w);border-color:transparent}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{font-size:14px;color:var(--t2)}
.row .v{font-weight:700;font-size:15px;text-align:right}
.row .src{display:block;font-size:11px;color:var(--t4);font-weight:400}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-left:6px;white-space:nowrap}
.b-ok{background:var(--ok-w);color:var(--ok)} .b-est{background:var(--warn-w);color:var(--warn)}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:4px 0}
.big.owe{color:var(--red)} .big.ref{color:var(--blue)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--blue);flex:none}
.chk b{display:block;font-size:15px}.chk span{font-size:13px;color:var(--t3)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;font-size:15px;font-weight:600}
.opt[aria-pressed=true]{border-color:var(--blue);background:var(--blue-w)}
.opt small{display:block;color:var(--t3);font-size:12px;margin-top:2px;font-weight:400}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;min-height:40px;padding:0 14px;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--blue);color:#fff;border-color:var(--blue)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}
.toggle input{width:44px;height:24px;accent-color:var(--blue);flex:none}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.done i{background:var(--ok)}
input[type=range]{width:100%;accent-color:var(--blue);height:32px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--t2);margin:14px 0 0}
.inp{display:block;width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font-size:16px;margin-top:6px;font-family:inherit;color:var(--t1);background:#fff}
.inp:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.err{color:#c9222f;font-size:13px;font-weight:600;margin:12px 0 0}
.links{display:flex;justify-content:center;gap:20px;margin-top:16px}.links button{border:0;background:none;color:var(--t3);font-size:14px;text-decoration:underline;min-height:40px}
.logo{width:56px;height:56px;border-radius:18px;background:var(--blue);color:#fff;font-size:28px;font-weight:800;display:grid;place-items:center;margin-bottom:10px}
.appname{font-size:20px;font-weight:800;margin-bottom:4px}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:10}
.sheetbg[hidden]{display:none}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:24px 20px 20px;max-height:90%;overflow:auto}
.toast{position:absolute;left:20px;right:20px;bottom:76px;background:#333d4b;color:#fff;border-radius:12px;padding:12px 16px;font-size:14px;text-align:center;z-index:20}
.toast[hidden]{display:none}
.act{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:#fff}
.act .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.act .eff{font-weight:800;color:var(--blue);white-space:nowrap;font-size:15px}
.act .eff.na{color:var(--t4);font-weight:600;font-size:13px}
.act p{font-size:13px;color:var(--t2);margin:6px 0 0}
.act.on{border-color:var(--blue);background:var(--blue-w)}
.ver{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center;margin:10px 0}
.ver div{background:var(--g1);border-radius:12px;padding:10px 4px;font-size:13px}
.ver b{display:block;font-size:17px}
.side{width:300px;background:#fff;border-radius:20px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08);position:sticky;top:24px}
.side h4{margin:0 0 10px;font-size:15px}
.phase{display:flex;gap:6px;margin-bottom:16px}
.phase div{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:var(--g1);color:var(--t4);font-size:13px;font-weight:700}
.phase div.on{background:var(--blue);color:#fff}.phase div.done{background:var(--blue-w);color:var(--blue)}
.met{list-style:none;margin:0 0 16px;padding:0;font-size:13px}
.met li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);color:var(--t3)}
.met li.hit{color:var(--t1);font-weight:700}
.met li.hit span:last-child{color:var(--ok)}
.side .btn{margin-top:6px}
@media(max-width:760px){
  .stage{display:block;padding:0}.phone{width:100%;height:100vh;max-height:none;border-radius:0;box-shadow:none}.side{display:none}
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone">
    <div class="screen" id="screen"></div>
    <nav class="nav" id="nav" hidden></nav>
    <div class="sheetbg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <aside class="side" id="side"></aside>
</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};

/* ---------- 표기 ---------- */
function kor(n){ n=Math.round(Math.abs(n)); var m=Math.floor(n/10000), r=n%10000;
  if(!m) return r.toLocaleString('ko-KR')+'원';
  return m.toLocaleString('ko-KR')+'만'+(r?' '+r.toLocaleString('ko-KR'):'')+'원'; }
function man(n){ return (n/10000).toLocaleString('ko-KR')+'만원'; }
var DISCL='참고용 예상치이며 세무 상담이 아니에요. 정확한 판단은 세무사에게 확인하세요.';

/* ---------- 예시 계산 모델 (근사, 시연용) ----------
   카드 공제: 총급여 25% 초과분부터. 문턱은 신용카드 사용액부터 채움. 신용 15% · 체크/현금영수증 30%, 한도 300만원.
   카드·인적공제는 소득공제라 한계세율(15%)을 곱하고, 월세·의료비는 세액공제라 세금에서 바로 뺀다. */
var MARG=0.15;
function cardDed(sal,credit,check){
  var th=sal*0.25, co=Math.max(0,credit-th), ko=Math.max(0,check-Math.max(0,th-credit));
  return Math.min(co*0.15+ko*0.30,3000000);
}
var BANDS={b1:['100만원 이하',700000],b2:['100~300만원',2000000],b3:['300~500만원',4000000],b4:['500만원 이상',6000000]};
function rentRate(sal){ return sal<=55000000?0.17:(sal<=80000000?0.15:0); }
function rentEligible(){ return S.ans.rent==='yes' && S.ans.house==='yes' && rentRate(S.d.salary)>0; }
function rentM(){ return Math.min(12,S.rentMonths+(S.rentDec&&S.rentMonths<12?1:0)); }
function rentCredit(){ return rentEligible()? Math.min(S.d.rent*rentM(),10000000)*rentRate(S.d.salary):0; }
function depDed(){ return S.ans.dep==='yes'? S.ans.depN*1500000*MARG:0; }
function medCredit(noGlass){ var b=BANDS[S.ans.medBand], m=(S.sens&&S.ans.med==='yes'&&b)?b[1]:0, g=noGlass?0:Math.min(S.inputs.glass||0,500000), tot=m+g; if(tot<=0) return 0; return Math.max(0,tot-S.d.salary*0.03)*0.15; }
function inpCredit(id){ var a=S.inputs[id]||0, sal=S.d.salary;
  if(id==='don') return Math.min(a,10000000)*0.15;
  if(id==='ins') return Math.min(a,1000000)*0.12;
  if(id==='edu') return Math.min(a,3000000)*0.15;
  if(id==='pen') return Math.min(a,9000000)*(sal<=55000000?0.15:0.12);
  if(id==='sav') return (S.ans.house==='yes'&&sal<=70000000)?Math.min(a,3000000)*0.4*MARG:0;
  if(id==='glass') return medCredit()-medCredit(true);
  return 0; }
function extraCredit(){ return inpCredit('don')+inpCredit('ins')+inpCredit('edu')+inpCredit('pen')+inpCredit('sav'); }
function baseTax(){ return 2365625*(S.d.salary/50000000); }
function syncBig(){ S.plan.big=S.bigList.reduce(function(s,b){return s+b.amt;},0); S.plan.saved=false; }
function split(p){ var rem=p.spend+p.big, chk=Math.round(rem*p.checkPct/100/10000)*10000; return {rem:rem,chk:chk,cr:rem-chk}; }
function taxOf(p,noExtra){
  var s=split(p), ded=cardDed(S.d.salary,S.d.credit+s.cr,S.d.check+s.chk)*MARG;
  var t=baseTax()-ded-(noExtra?0:depDed()+rentCredit()+medCredit()+extraCredit());
  return Math.max(0,Math.round(t/10)*10);
}
function recPct(p){ var s=p.spend+p.big; if(!s) return 0; var crPart=Math.max(0,Math.min(s,S.d.salary*0.25-S.d.credit-S.d.check)); return Math.round((s-crPart)/s*20)*5; }
function baseline(){ return {spend:2000000,big:0,checkPct:0}; }
function diffOf(p){ return taxOf(p)-S.paid; }          // 양수 = 추가 납부
function cardSaving(p){ return taxOf({spend:p.spend,big:p.big,checkPct:0})-taxOf(p); }
function resultText(diff){ return diff>0?['추가 납부 예상 '+kor(diff),'owe']:diff<0?['환급 예상 '+kor(diff),'ref']:['납부·환급 차이 없음','ref']; }

/* ---------- 상태 ---------- */
function fresh(){ return {
  screen:'s00', tab:'home', history:[], stage:'nov',
  terms:false, privacy:false, link:false, sens:false, mkt:false,
  
  manual:false, d:{salary:42000000,credit:9000000,check:0,excl:1300000,rent:350000}, salaryOk:false,
  ans:{rent:null,house:null,dep:null,depN:0,life:null,med:null,medBand:null,ins:null,pen:null}, qi:0, pend:null,
  paid:0, nov:null, plan:{spend:2000000,big:0,checkPct:0,saved:false}, picked:{}, noti:true,
  seenSheet:false, report:null, dec:null, final:null, helper:{up:false,ok:{}}, subOk:false, subOn:false, subPaidOk:false,
  inputs:{}, rentMonths:11, rentDec:false, bigList:[], subRemind:false, touches:0, counting:false, touchFinal:null, trial:true, checks:{}
};}
var S=fresh(), M={};
var ML=[['link','토스 연동 동의'],['touch','첫 결과까지 터치'],['salary','연봉 추정 [맞아요]'],['plan','슬라이더 계획 저장'],['sheet','전환 알림 확인'],['sub','1월 구독 시작(시연)'],['helper','도우미 제출 가이드 완료']];
function track(k,v){ M[k]=v===undefined?1:v; }

/* ---------- 이동 ---------- */
var TABS={home:1,ways:1,me:1}, STARTS=['s00','s01','link','manual','s02','s03'], ENDS=['s09','s10','s11','s12','s13','done'];
function go(sc,o){ o=o||{};
  if(!o.noPush && S.screen!==sc) S.history.push(S.screen);
  S.screen=sc; if(TABS[sc]) S.tab=sc; if(sc==='s05') S.tab='ways';
  if(sc==='link'&&!S.est0&&!S.counting&&S.touchFinal==null) S.counting=true;
  render(); $('screen').scrollTop=0; }
function back(){ var p=S.history.pop(); if(p) go(p,{noPush:true}); }
function phase(){ return ENDS.indexOf(S.screen)>-1?2:(STARTS.indexOf(S.screen)>-1?0:1); }

/* ---------- 공통 조각 ---------- */
function top(t,step){ return '<div class="topbar"><button class="back" data-act="back" aria-label="뒤로">←</button><b>'+t+'</b>'+(step?'<span class="step">'+step+'</span>':'')+'</div>'; }
function openSheet(h){ $('sheet').innerHTML=h; $('sheetBg').hidden=false; var i=$('sheet').querySelector('input'); if(i) i.focus(); }
function closeSheet(){ $('sheetBg').hidden=true; }
function toast(m){ var t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){t.hidden=true},2200); }
function dday(){ return S.stage==='dec'?'12월 31일까지 D-17':'12월 31일까지 D-52'; }
function thr(){ return S.d.salary*0.25; }
function counted(){ return S.d.credit+S.d.check; }

/* ---------- 줄이는 방법 (핵심) ---------- */
var INP={
  don:{label:'올해 이미 한 기부 금액(만원)',note:'종류별로 공제율이 달라 15%로 단순 계산한 추정이에요.'},
  glass:{label:'올해 산 안경·렌즈 금액(만원)',note:'연 50만 원까지만 의료비에 합산돼요. 의료비 합계가 총급여의 3%를 넘어야 효과가 있어요.'},
  ins:{label:'올해 낸 보장성 보험료(만원)',note:'연 100만 원 한도, 12% 세액공제로 계산한 추정이에요.'},
  edu:{label:'올해 낸 교육비(만원)',note:'대상·한도가 종류별로 달라 연 300만 원까지 15%로 단순 계산한 추정이에요.'},
  pen:{label:'올해 납입한 연금저축·IRP(만원)',note:'연 900만 원 한도, 총급여 5,500만 원 이하 15%로 계산한 추정이에요.'},
  sav:{label:'올해 납입한 청약저축(만원)',note:'무주택 세대주·총급여 7천만 원 이하일 때 연 300만 원 한도 40% 소득공제로 계산한 추정이에요.'}
};
function actions(){
  var L=[], rec=Object.assign({},S.plan,{checkPct:recPct(S.plan)}), rr=rentRate(S.d.salary)||0.17;
  function add(o){ if((o.id==='ins'||o.id==='pen')&&(S.ans[o.id]==='yes'||S.ans[o.id]==='no')) return; if(INP[o.id]){ o.input=INP[o.id]; o.applied=(S.inputs[o.id]||0)>0; o.eff=o.applied?inpCredit(o.id):null; o.sure=o.applied; } L.push(o); }
  add({id:'card',t:'남은 지출, 결제 수단 정하기',eff:cardSaving(rec),sure:true,dl:'12월 31일 전',cat:'now',
    how:'카드 공제는 12월 31일까지 결제한 금액 기준이에요. 문턱(총급여의 25%)까지는 신용카드, 넘은 뒤부터는 체크카드·현금영수증으로 정하면 공제율이 2배예요. 원래 쓸 돈만 해당돼요.'});
  if(S.ans.rent==='yes'){
    var ok=S.ans.house==='yes';
    add({id:'rent',t:'월세 세액공제 챙기기 ('+rentM()+'개월)',eff:Math.min(S.d.rent*rentM(),10000000)*rr,sure:ok&&rentEligible(),dl:'12월 31일 기준 요건',cat:'now',
      how:ok?'월세는 계좌이체로 계속 내세요. 전입신고·무주택 세대주 요건이 12월 31일 기준이에요. 임대차계약서 사본과 이체 내역은 1월에 필요해요.':'무주택 세대주·전입신고 요건을 지금 확인해 보세요. 해당되면 세금에서 바로 빠져요. 모르겠어요로 답해서 이번 예상에는 넣지 않았어요.'});
    if(S.rentMonths<12&&S.ans.house!=='no') add({id:'rent12',t:'월세 12월분도 이체하기',eff:S.d.rent*rr,sure:S.rentDec,dl:'12월 31일 전',cat:'now',toggle:'rentDec',
      how:'월세 공제는 낸 개월 수만큼 계산돼요. 12월분을 계좌이체로 내면 한 달치가 더 포함돼요. 원래 내는 월세만 해당돼요.'});
  }
  if(S.ans.dep==='yes') add({id:'dep',t:'부양가족 공제 대상 확인',eff:S.ans.depN*1500000*MARG,sure:true,dl:'12월 31일 기준',cat:'now',
    how:'같이 사는 부모님·자녀의 나이·소득 요건을 확인하세요. 형제자매와 중복 공제는 안 돼요. 정확한 요건은 1월 도우미에서 한 번 더 확인해요.'});
  add({id:'cash',t:'현금영수증 등록 확인',eff:null,sure:false,dl:'12월 31일 전',cat:'now',

    case 'consentOk': if(S.link) track('link'); S.history=[]; go('link',{noPush:true}); break;
    case 'doLink': S.manual=false; go('s02'); break;
    case 'doManual': S.manual=true; S.salaryOk=true; S.ans.rent=S.d.rent>0?'yes':'no'; S.d.check=0; S.d.excl=0; S.qi=0; go('s03'); break;
    case 'salaryOk': S.salaryOk=true; track('salary'); render(); toast('연봉 추정을 확인했어요'); break;
    case 'editSalary': openSheet('<h3>연봉(세전)</h3><p class="fine">단위: 만원</p><input class="inp" type="number" min="0" inputmode="numeric" id="inp" value="'+(S.d.salary/10000)+'"><button class="btn" data-act="saveSalary">저장</button><button class="btn sec" data-act="closeSheet">취소</button>'); break;
    case 'saveSalary': var n=Number($('inp').value); if(!(n>0)){ toast('숫자를 입력해 주세요'); break; } S.d.salary=Math.round(n*10000); S.salaryOk=true; track('salary'); closeSheet(); render(); break;
    case 'closeSheet': closeSheet(); break;
    case 'otherPay': toast('시연에서는 카드를 더 연결하지 않아요'); break;
    case 'foundOk': S.salaryOk=true; track('salary'); S.qi=0; S.inputs={}; S.ans={rent:null,house:null,dep:null,depN:0,life:null,med:null,medBand:null,ins:null,pen:null}; go('s03'); break;
    case 'ans': var kv=v.split(':'), k=kv[0], val=kv[1];
      if((k==='ins'||k==='pen')&&val==='yes'){ S.ans[k]='yes'; S.pend=k+'Amt'; render(); break; }
      if((k==='ins'||k==='pen')&&val!=='yes'){ S.ans[k]=val; delete S.inputs[k]; nextQ(); break; }
      if(k==='dep'&&val==='yes'){ S.ans.dep='yes'; S.pend='depN'; render(); break; }
      if(k==='med'&&val==='yes'){ S.ans.med='yes'; if(S.sens){ S.pend='medBand'; render(); break; } S.ans.medBand=null; }
      else S.ans[k]=val;
      if(k==='life'&&val==='yes') toast('해당 항목은 1월 도우미에서 확인해요');
      if(k==='rent'&&val==='no') S.ans.house=null;
      nextQ(); break;
    case 'depN': S.ans.depN=Number(v); nextQ(); break;
    case 'medBand': S.ans.medBand=v; nextQ(); break;
    case 'subRemind': S.subRemind=!S.subRemind; render(); toast(S.subRemind?'1월에 구독 안내를 알려드릴게요':'알림을 껐어요'); break;
    case 'rm': S.rentMonths=Math.max(1,Math.min(12,S.rentMonths+Number(v))); render(); break;
    case 'pick': S.picked[v]=!S.picked[v]; render(); break;
    case 'tog': S[v]=!S[v]; S.plan.saved=false; render(); toast(S[v]?'12월분을 반영했어요':'12월분 반영을 뺐어요'); break;
    case 'medEdit': openSheet('<h3>올해 병원비는 대략 얼마인가요?</h3><div class="chips" style="flex-direction:column">'+Object.keys(BANDS).map(function(b){return '<button class="chip" data-act="medPick" data-v="'+b+'" aria-pressed="'+(S.ans.medBand===b)+'">'+BANDS[b][0]+'</button>';}).join('')+'</div><p class="fine">대략이면 돼요. 정확한 값은 1월 간소화 자료로 확인해요.</p><button class="btn sec" data-act="closeSheet">취소</button>'); break;
    case 'medPick': S.ans.medBand=v; S.plan.saved=false; closeSheet(); render(); toast('예상에 반영했어요'); break;
    case 'qEdit': openSheet('<h3>'+(v==='ins'?'올해 낸 보험료':'올해 납입한 연금저축·IRP')+'</h3><p class="fine">단위: 만원</p><input class="inp" type="number" min="0" inputmode="numeric" id="inp" value="'+(S.inputs[v]/10000)+'"><button class="btn" data-act="qEditSave" data-v="'+v+'">저장</button><button class="btn sec" data-act="closeSheet">취소</button>'); break;
    case 'qEditSave': var qn=Number($('inp').value); if(!(qn>0)){ toast('금액(만원)을 입력해 주세요'); break; } S.inputs[v]=Math.round(qn*10000); S.plan.saved=false; closeSheet(); render(); toast('예상에 반영했어요'); break;
    case 'inpSave': var iv=document.querySelector('[data-iv="'+v+'"]'), ia=Number(iv&&iv.value); if(!(ia>0)){ toast('금액(만원)을 입력해 주세요'); break; } S.inputs[v]=Math.round(ia*10000); S.plan.saved=false; var y=$('screen').scrollTop; render(); $('screen').scrollTop=y; toast('예상에 반영했어요'); break;
    case 'inpClear': delete S.inputs[v]; S.plan.saved=false; var y2=$('screen').scrollTop; render(); $('screen').scrollTop=y2; break;
    case 'bigAsk': openSheet('<h3>원래 예정된 큰 지출</h3><p class="fine">12월 31일까지 원래 쓸 계획이던 금액만 넣으세요. 더 쓰라는 뜻이 아니에요.</p><div class="chips"><button class="chip" data-act="bigAdd" data-v="노트북|1500000">노트북 150만원</button><button class="chip" data-act="bigAdd" data-v="가전|800000">가전 80만원</button><button class="chip" data-act="bigAdd" data-v="여행·기타|500000">50만원</button></div><label class="lbl">직접 입력 — 항목 이름(선택)<input class="inp" type="text" id="bn" maxlength="12" placeholder="예: 이사 비용"></label><label class="lbl">금액(만원)<input class="inp" type="number" min="1" inputmode="numeric" id="ba" placeholder="예: 120"></label><button class="btn" data-act="bigAddCustom">추가</button><button class="btn sec" data-act="closeSheet">닫기</button>'); break;
    case 'bigAdd': var bp=v.split('|'); S.bigList.push({n:bp[0],amt:Number(bp[1])}); syncBig(); closeSheet(); render(); break;
    case 'bigAddCustom': var am=Number($('ba').value); if(!(am>0)){ toast('금액을 입력해 주세요'); break; } S.bigList.push({n:($('bn').value.trim()||'큰 지출'),amt:Math.round(am*10000)}); syncBig(); closeSheet(); render(); break;
    case 'bigDel': S.bigList.splice(Number(v),1); syncBig(); render(); break;
    case 'recommend': S.plan.checkPct=recPct(S.plan); S.plan.saved=false; render(); toast('추천 비율로 맞췄어요'); break;
    case 'savePlan': S.plan.saved=true; S.picked.card=true; track('plan'); go('s06'); break;
    case 'toDec': S.stage='dec'; var crPart=Math.max(0,thr()-counted())+50000; S.d.credit+=crPart; S.crPart=crPart; var tt=S.plan.spend+S.plan.big; S.dec={diff:taxOf({spend:Math.max(0,tt-crPart),big:0,checkPct:S.plan.saved?100:0})-S.paid}; S.history=[]; S.tab='home'; S.screen='home'; render();
      var left=800000, gain=left*(0.30-0.15)*MARG;
      openSheet('<span class="tag red">결제 수단 전환 알림</span><h2 style="margin-top:8px">카드 공제 문턱을 넘었어요!<br>이제부터는 체크카드로 결제하면 공제가 2배예요.</h2><p class="sub" style="font-size:14px">남은 17일 예상 지출 약 80만 원을 체크카드로 결제하면 세금이 약 <b>'+kor(gain)+'</b> 줄어들 것으로 추정돼요.</p><p class="fine">추정 연봉 기준이에요. <button data-act="editSalary" style="border:0;background:none;color:var(--blue);text-decoration:underline">연봉 다시 확인하기</button> · 원래 쓸 돈만 해당돼요. 카드 혜택은 계산에 넣지 않았어요.</p><button class="btn" data-act="sheetOk">알겠어요</button><button class="btn sec" data-act="sheetPlan">계획 다시 보기</button>'); break;
    case 'sheetOk': track('sheet'); closeSheet(); toast('좋아요. 이제부터 체크카드를 써볼게요'); break;
    case 'sheetPlan': track('sheet'); closeSheet(); go('s05'); break;
    case 'toReport': var followed=S.plan.saved; var tot=S.plan.spend+S.plan.big, rest=Math.max(0,tot-S.crPart);
      S.d.check+= followed?rest:0; S.d.credit+= followed?0:rest;
      var pl={spend:0,big:0,checkPct:0}, dFin=taxOf(pl)-S.paid, restCr=followed?rest:0,
        savedTax=(cardDed(S.d.salary,S.d.credit,S.d.check)-cardDed(S.d.salary,S.d.credit+restCr,S.d.check-restCr))*MARG;
      S.report={diff:dFin, saving:Math.max(0,Math.round(savedTax/10)*10), chkPct:tot?Math.round(restCr/tot*100):0}; S.dec=null; S.stage='dec'; go('s08'); break;
    case 'toJan': S.stage='jan'; S.history=[]; S.tab='home'; go('s09',{noPush:true}); break;
    case 'subStart': S.subOn=true; S.helperStep=0; track('sub'); go('s11'); break;
    case 'upload': S.helper.up=true; render(); toast('간소화 자료와 비교했어요'); break;
    case 'hok': S.helper.ok[v]=!S.helper.ok[v]; render(); break;
    case 'helperDone': track('helper'); S.helperStep=6; go('done'); break;
    case 'amt': var ap=v.split(':'); S.inputs[ap[0]]=Number(ap[1]); nextQ(); break;
    case 'amtCustom': var ca=Number($('qa').value); if(!(ca>0)){ toast('금액(만원)을 입력해 주세요'); break; } S.inputs[v]=Math.round(ca*10000); nextQ(); break;
    case 'delAsk': openSheet('<h3>동의를 철회하고 데이터를 삭제할까요?</h3><p class="fine">입력한 정보와 저장한 계획이 모두 지워지고 되돌릴 수 없어요.</p><button class="btn danger" data-act="delDo">철회하고 삭제</button><button class="btn sec" data-act="closeSheet">취소</button>'); break;
    case 'delDo': closeSheet(); M={}; S=fresh(); render(); toast('동의를 철회하고 데이터를 삭제했어요'); break;
    case 'home2': S.history=[]; S.stage='jan'; go('home',{noPush:true}); break;
    case 'restart': M={}; S=fresh(); closeSheet(); render(); break;
  }
});
/* 가입 동의에서 토스 연동 동의를 선택 사항으로 두었으므로, 로그인 후 재진입 시에도 상태 유지 */
render();
})();
