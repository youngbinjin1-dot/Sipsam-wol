   · 소득공제(카드·부양가족·청약)는 한계세율 15%를 곱해 세금 감소액으로 환산
   · 세액공제: 월세 17%(총급여 5,500만 이하, 8,000만 이하 15%), 의료비 (금액-총급여 3%)×15%, 보장성 보험 12%(100만 한도), 연금저축·IRP 15%(5,500만 초과 12%)
   · 이미 낸 세금 ≈ 공제 전 세금 - 기본 카드 공제 - 30만원 (월급에서 미리 뗀 세금 추정) */
const MARG = 0.15, BASE_PLAN = 200;
const sal = () => (S.d.salary + (S.d.bonus||0)) * 1e4;
const thr = () => sal()*0.25;
const spentNow = () => (S.d.credit + S.d.check) * 1e4;
function cardDed(credit, check){            // 원 단위
  const th = thr(), co = Math.max(0, credit-th), ko = Math.max(0, check - Math.max(0, th-credit));
  return Math.min(co*0.15 + ko*0.30, 3000000);
}
const baseTax = () => 2365625 * sal()/5e7;
const rentRate = () => sal()<=5.5e7 ? 0.17 : (sal()<=8e7 ? 0.15 : 0);
const rentOk = () => S.ans.rent==='yes' && S.ans.house==='yes' && rentRate()>0 && S.d.rent>0;
const monthsPaid = () => S.rentMonths + (S.rentDec && S.rentMonths<12 ? 1 : 0);
const rentCredit = (m=monthsPaid()) => rentOk() ? Math.min(S.d.rent*1e4*m, 1e7)*rentRate() : 0;
const rentDecGain = () => (rentOk() && !S.rentDec && S.rentMonths<12) ? Math.min(S.d.rent*1e4, Math.max(0,1e7-S.d.rent*1e4*S.rentMonths))*rentRate() : 0;
const depCredit = () => (S.ans.dep||0)*1500000*MARG;
const medBase = () => ((S.consent.sensitive && S.ans.med==='yes') ? S.ans.medAmt : 0) + Math.min(S.reflect.a1||0, 50);
const medCredit = () => Math.max(0, medBase()*1e4 - sal()*0.03)*0.15;
const insCredit = () => Math.min(S.ans.ins||0, 100)*1e4*0.12;
const penRate = () => sal()<=5.5e7 ? 0.15 : 0.12;
const penCredit = () => Math.min(S.ans.pen||0, 900)*1e4*penRate();
const reflectCredit = () => (S.reflect.a2||0)*1e4*0.15 + Math.min(S.reflect.a3||0,300)*1e4*0.15
  + ((S.ans.house==='yes' && sal()<=7e7) ? Math.min(S.reflect.a4||0,300)*1e4*0.4*MARG : 0);
const extras = () => rentCredit()+depCredit()+medCredit()+insCredit()+penCredit()+reflectCredit();
function split(total, ratio){ const debit = Math.round(total*ratio/100); return {credit: total-debit, debit}; }
function taxOf(total, ratio){
  const sp = split(total, ratio);
  const ded = cardDed(S.d.credit*1e4 + sp.credit*1e4, S.d.check*1e4 + sp.debit*1e4)*MARG;
  return Math.max(0, round10(baseTax() - ded - extras()));
}
const paid = () => round10(baseTax() - cardDed((S.d.credit+BASE_PLAN)*1e4, S.d.check*1e4)*MARG - 300000);
const refundOf = (total, ratio) => paid() - taxOf(total, ratio);          // +면 환급, -면 추가 납부
function planResult(total, ratio){
  const sp = split(total, ratio);
  const val = refundOf(total, ratio), base = refundOf(total, 0);
  return {credit:sp.credit, debit:sp.debit, val, base, diff: val-base};
}
function recRatio(total){
  if(total<=0) return 0;
  const room = Math.max(0, thr() - spentNow())/1e4;
  return Math.min(100, Math.round(Math.max(total-room,0)/total*100/5)*5);
}
const cardSaving = (total=S.plan.total) => planResult(total, recRatio(total)).diff;
const resLabel = n => n>=0 ? `환급 ${won(n)}` : `<span class="owe">추가 납부 ${won(-n)}</span>`;
const heroCls = n => n<0 ? ' owe' : '';
const savedPlan = () => S.saved ? {total:S.saved.total, ratio:S.saved.ratio} : {total:BASE_PLAN, ratio:0};
const currentRefund = () => { const p = savedPlan(); return refundOf(p.total, p.ratio); };
function moreItems(){
  const L=[];
  if(S.ans.rent==='yes' && S.d.rent>0){
    L.push({e:'🏠',t:`월세 세액공제 (${monthsPaid()}개월)`,tag:'⏰ 12/31 기준',amt:rentOk()?rentCredit():0,
      check:!rentOk()});
  }
  if(S.ans.dep>0) L.push({e:'👨‍👩‍👧',t:'부양가족 공제 확인',tag:'⏰ 12/31 기준',amt:depCredit()});
  if(rentDecGain()>0) L.push({e:'🏠',t:'월세 12월분도 이체하기',tag:'⏰ 12/31 전',amt:rentDecGain(),check:true});
  return L;
}
const moreMax = () => moreItems().reduce((a,b)=>a+(b.amt||0),0);
const round10 = n => Math.round(n/10)*10;
function won(n){
  n = Math.round(n); const neg = n<0; n=Math.abs(n);
  const man = Math.floor(n/10000), rest = n%10000;
  let s = '';
  if(man) s += man.toLocaleString('ko-KR')+'만';
  if(rest) s += (man?' ':'')+rest.toLocaleString('ko-KR');
  if(!s) s='0';
  return (neg?'−':'')+s+'원';
}

    ${opts.map((o,i)=>`<button class="opt ${i?'mt8':'mt12'}" data-act="ans" data-k="${key}" data-v="${vals[i]}" data-next="${i===0&&yesNext?yesNext:next}">${o}</button>`).join('')}
    <button class="prevlink" data-act="back">← 이전 질문으로</button></div>`;
}
function qAmt(step, n, e, q, opts, next, input, key){
  return `<div class="screen">${topBar('질문 카드',step)}${qBar(n,6)}${heroHead(e,q)}
    <div class="pills col" style="padding-top:8px">${opts.map(([l,v])=>`<button class="pill ${S.bandSel[key]===l?'sel':''}" data-act="pick" data-k="${key}" data-l="${l}" data-v="${v}" data-next="${next}">${l}</button>`).join('')}</div>
    ${input?`<div class="inrow" style="padding-top:8px"><input class="field" id="amtIn" inputmode="numeric" placeholder="직접 입력(만원)" style="font-weight:400"><button class="btn-s" data-act="pickInput" data-k="${key}" data-next="${next}">다음</button></div>`:''}
    <button class="prevlink" data-act="back">← 이전 질문으로</button></div>`;
}
function planParts(){

  const rc=planResult(p.total,0), rd=planResult(p.total,100), rr=planResult(p.total,recRatio(p.total));
  return {
    stats:`<div class="stats"><div class="stat"><div class="l">💳 신용카드</div><div class="n">${r.credit}만원</div></div><div class="stat"><div class="l">🧾 체크·현금영수증</div><div class="n">${r.debit}만원</div></div></div>`,
    cmp:`<div class="cmp" style="padding-top:10px"><div class="box2"><div class="l">지금처럼</div><div class="n ${r.base<0?'owe':''}">${won(Math.abs(r.base))}</div><div class="s ${r.base<0?'owe':''}">${r.base>=0?'환급':'추가 납부'}</div></div><div>→</div><div class="box2"><div class="l">이 계획</div><div class="n ${r.val<0?'owe':''}" style="${diff>0&&r.val>=0?'color:var(--primary)':''}">${won(Math.abs(r.val))}</div><div class="s ${r.val<0?'owe':''}">${r.val>=0?'환급':'추가 납부'}</div></div></div><div class="center" style="padding-top:10px;font-size:16px;font-weight:700">${diff>0?`세금 ${won(diff)} 줄어요`:'지금은 차이가 없어요'}</div>`,
    opts:optRow('💳 신용카드', rc, false)+optRow('🧾 체크·현금영수증', rd, true)+optRow('✨ 추천', rr, true)
  };
}

  $('pStats').innerHTML=q.stats; $('pCmp').innerHTML=q.cmp; $('pOpts').innerHTML=q.opts;
  $('planTotal').textContent=S.plan.total+'만원';

}

}

const $ = id => document.getElementById(id);
/* GA4 이벤트 (개인정보·입력값은 보내지 않고 화면 이름과 클릭 여부만 보냄) */
function ga(n,p){ try{ if(window.gtag) gtag('event',n,p||{}); }catch(e){} }
const GA_EVENTS = { consentAll:'mvp_link', savePlan:'mvp_plan', goDec:'mvp_sheet', goReport:'report_view', recommend:'recommend_ratio', addItem:'big_spend_add', addCustom:'big_spend_add', notifyMe:'mvp_sub_remind', finish:'mvp_helper' };
let gaLastScreen=null, gaSlider=false;
function cur(){ return S.stack[S.stack.length-1]; }
function render(keepScroll){
  const key = cur(), sc = SCREENS[key];
  if(key!==gaLastScreen){ gaLastScreen=key; ga('screen_view',{screen_name:key}); }
  const st = $('scroll').scrollTop;
  $('view').innerHTML = sc.body();
  if(!keepScroll) $('scroll').scrollTop = 0; else $('scroll').scrollTop = st;
  // 하단 고정 CTA
  const ctas = typeof sc.cta==='function' ? sc.cta() : sc.cta;
  const cta = $('cta');
  if(ctas || sc.cap){
    cta.hidden = false;
    cta.classList.toggle('with-nav', !!sc.tab);
    cta.innerHTML = (sc.cap?`<p class="cap">${sc.cap}</p>`:'') + (ctas||[]).map((c,i)=>`<button class="btn ${c.style||''}" ${c.disabled?'disabled':''} ${c.go?`data-go="${c.go}"`:''} ${c.act?`data-act="${c.act}"`:''}>${c.label}</button>`).join('');
  } else { cta.hidden = true; cta.innerHTML=''; }
  // 하단 탭
  const nav = $('nav'); nav.hidden = !sc.tab;
  nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===sc.tab?'page':'false'));
  bindRanges();
}
function go(key){
  if(SCREENS[key].tab){ S.stack = [key]; } else S.stack.push(key);
  render();
}
function back(){ if(S.stack.length>1){ S.stack.pop(); render(); } else if(SCREENS[cur()].tab){ /* 탭 최상위 */ } }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; $('phone').appendChild(t); setTimeout(()=>t.remove(),1800); }
function setPath(obj, path, fn){ const ks=path.split('.'); let o=obj; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; const k=ks[ks.length-1]; o[k]=fn(o[k]); }

function bindRanges(){
  const r1=$('r1'), r2=$('r2');
  if(r1) r1.oninput = e => { if(!gaSlider){ gaSlider=true; ga('slider_touch'); } S.plan.total = +e.target.value; updatePlan(); };
  if(r2) r2.oninput = e => { if(!gaSlider){ gaSlider=true; ga('slider_touch'); } S.plan.debitRatio = +e.target.value; updatePlan(); };
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act],[data-toggle],[data-tab],[data-toast]');
  if(!t) return;
  if(t.tagName==='SUMMARY') return;
  if(t.dataset.close) closeSheet();
  if(t.dataset.tab){ go(t.dataset.tab); return; }
  if(t.dataset.toast){ toast(t.dataset.toast); return; }
  if(t.dataset.toggle){ setPath(S, t.dataset.toggle, v=>!v); render(true); return; }
  if(t.dataset.go){
    let k = t.dataset.go;
    if(k==='qMed' && !S.consent.sensitive) k='qIns';
    go(k); return;
  }
  const a = t.dataset.act;
  if(GA_EVENTS[a]) ga(GA_EVENTS[a]);
  if(a==='consentGo' && S.consent.toss) ga('mvp_link');
  switch(a){
    case 'back': back(); break;
    case 'consentAll': Object.keys(S.consent).forEach(k=>S.consent[k]=true); go('toss'); break;
    case 'consentGo': go(S.consent.toss?'toss':'manualIntro'); break;
    case 'rentMinus': S.rentMonths=Math.max(1,S.rentMonths-1); render(true); break;
    case 'rentPlus': S.rentMonths=Math.min(12,S.rentMonths+1); render(true); break;
    case 'depNone': S.ans.dep=0; go(S.consent.sensitive?'qMed':'qIns'); break;
    case 'depSet': S.ans.dep=+t.dataset.v; go(S.consent.sensitive?'qMed':'qIns'); break;
    case 'ans': {
      const k=t.dataset.k, v=t.dataset.v; let next=t.dataset.next;
      if(k==='rent' || k==='house' || k==='med') S.ans[k]=v;
      if(k==='ins' && v!=='yes') S.ans.ins=0;
      if(k==='pen' && v!=='yes') S.ans.pen=0;
      if(k==='ins' && v==='yes' && !S.ans.ins) S.ans.ins=75;
      if(k==='pen' && v==='yes' && !S.ans.pen) S.ans.pen=200;
      if(next==='qMed' && !S.consent.sensitive) next='qIns';
      go(next); break; }
    case 'pick': { const k=t.dataset.k; S.bandSel[k]=t.dataset.l; if(k==='medAmt'){ S.ans.med='yes'; S.ans.medAmt=+t.dataset.v; } else S.ans[k]=+t.dataset.v; go(t.dataset.next); break; }
    case 'pickInput': { const v=+($('amtIn').value||0); if(!v){ toast('금액을 넣거나 위에서 골라 주세요'); break; } S.ans[t.dataset.k]=v; S.bandSel[t.dataset.k]=v+'만원'; go(t.dataset.next); break; }
    case 'manualNext': { S.d.check=0; S.ans.rent = S.d.rent>0?'yes':'no'; S.rentMonths=Math.min(12,Math.max(1,S.rentMonths||1)); go(S.d.rent>0?'qHome':'qDep'); break; }
    case 'recommend': S.plan.debitRatio = recRatio(S.plan.total); updatePlan(); toast('추천 비율로 맞췄어요'); break;
    case 'savePlan': S.saved = {total:S.plan.total, ratio:S.plan.debitRatio}; go('saved'); break;
    case 'goHome': S.stack=['home']; render(); break;
    case 'goDec': S.season='dec'; render(); thresholdSheet(); break;
    case 'goReport': go('report'); break;
    case 'openBig': bigSheet(); break;
    case 'addItem': S.plan.items.push({n:t.dataset.n, v:+t.dataset.v}); S.plan.total=Math.min(500,S.plan.total+ +t.dataset.v); closeSheet(); render(true); toast(`${t.dataset.n} ${t.dataset.v}만원을 더했어요`); break;
    case 'addCustom': { const v=+($('bigAmt').value||0); if(!v){ toast('금액을 넣어 주세요'); break; } const n=$('bigName').value||'기타'; S.plan.items.push({n,v}); S.plan.total=Math.min(500,S.plan.total+v); closeSheet(); render(true); toast(`${n} ${v}만원을 더했어요`); break; }
    case 'rmItem': { const it=S.plan.items.splice(+t.dataset.v,1)[0]; S.plan.total=Math.max(0,S.plan.total-it.v); render(true); break; }
    case 'closeSheet': closeSheet(); break;
    case 'closeSheetBg': if(e.target===t) closeSheet(); break;
    case 'notifyMe': toast('시작하면 알려드릴게요'); back(); break;
    case 'reflect': { const inp=t.parentNode.querySelector('input'); const v=+(inp&&inp.value||0); if(!v){ toast('금액을 넣어 주세요'); break; } S.reflect[t.dataset.k]=v; S.tipsDone[t.dataset.k]=true; render(true); toast('예상에 반영했어요'); break; }
    case 'finish': toast('수고했어요! 이제 회사 정산 결과를 기다려요'); S.stack=['home']; S.season='nov'; setTimeout(render,300); break;
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeSheet(); });
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.bind; if(!k) return;
  const v = Math.max(0, +(e.target.value.replace(/[^0-9]/g,'')||0));
  setPath(S, k, () => k==='rentMonths' ? Math.min(12, v) : v);
});
document.addEventListener('change', e => { if(e.target.dataset && e.target.dataset.bind==='d.salary' && cur()==='found') render(true); });
render();
</script>
</body>
</html>
